<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sapphire Wednesday Player</title>
<style>html,body,#game{margin:0;width:100%;height:100%;background:#070d1b;color:#f1f7ff}body{font-family:monospace}#error{padding:24px;line-height:1.7}button{padding:12px 24px}canvas{image-rendering:pixelated}</style></head>
<body><div id="game"></div><div id="error" hidden></div>
<script>
const game = new URLSearchParams(location.search).get('game') === 'ruby' ? 'ruby' : 'sapphire';
window.EJS_player = '#game';
window.EJS_core = 'gba';
// Hosted copies have no ROMs: the hub hands over the player's own file instead.
// Rewrapped in this frame's File so EmulatorJS's instanceof check passes.
const parentRom = parent !== window && parent.swRoms ? parent.swRoms[game] : null;
const ownRom = parentRom ? new File([parentRom], parentRom.name) : null;
window.EJS_gameUrl = ownRom || 'roms/' + game + '.gba';
window.EJS_gameName = 'Sapphire Wednesday - Pokemon ' + game;
window.EJS_gameID = game === 'ruby' ? 1002 : 1001;
window.EJS_pathtodata = 'emulator/data/';
window.EJS_language = 'en-US';
window.EJS_disableAutoLang = false;
window.EJS_color = '#41dbc5';
window.EJS_backgroundColor = '#070d1b';
window.EJS_startButtonName = 'START GAME';
window.EJS_alignStartButton = 'center';
window.EJS_volume = 0.35;
window.EJS_noAutoFocus = false;
window.EJS_startOnLoaded = false;
window.EJS_Buttons = {netplay:false,cheat:false};
window.EJS_defaultControls = {0:{
  0:{value:'x',value2:'BUTTON_2'},2:{value:'shift',value2:'SELECT'},3:{value:'enter',value2:'START'},
  4:{value:'up arrow',value2:'DPAD_UP'},5:{value:'down arrow',value2:'DPAD_DOWN'},
  6:{value:'left arrow',value2:'DPAD_LEFT'},7:{value:'right arrow',value2:'DPAD_RIGHT'},
  8:{value:'z',value2:'BUTTON_1'},10:{value:'a',value2:'LEFT_TOP_SHOULDER'},11:{value:'s',value2:'RIGHT_TOP_SHOULDER'},
  24:{value:'1'},25:{value:'2'},26:{value:'3'},27:{value:'f'},28:{value:'r'}
},1:{},2:{},3:{}};
window.EJS_onGameStart = () => parent.postMessage({type:'game-started',game},location.origin);
window.EJS_onSaveState = () => parent.postMessage({type:'game-saved',game},location.origin);
window.EJS_onSaveSave = () => parent.postMessage({type:'game-saved',game},location.origin);
function fail(){ document.getElementById('game').hidden=true;const el=document.getElementById('error');el.hidden=false;el.textContent='The emulator could not load. Close this player and reopen it. If the problem continues, relaunch Sapphire Wednesday using the .command file.'; }
window.addEventListener('error',event=>{ if(event.message && /EmulatorJS is not defined/.test(event.message)) fail(); });
const loader = document.createElement('script');loader.src='emulator/data/loader.js';loader.onerror=fail;document.body.append(loader);
</script></body></html>
